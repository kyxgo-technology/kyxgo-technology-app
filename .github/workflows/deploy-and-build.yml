name: Deploy Pages, Build App & Silent Fast Signed Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Deploy index.html to GitHub Pages
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Build Python EXE, Sign, & Create Auto-Silent Installer
  build-and-package:
    needs: deploy-pages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      # Build Single-File Executable
      - name: Build Executable with PyInstaller
        shell: powershell
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "index.html;." --icon="logo.ico" --name "KyxgoPartnerApp" app.py

      # Self-Signed Certificate Generation
      - name: Generate Code Signing Certificate
        shell: powershell
        run: |
          New-SelfSignedCertificate -CertStoreLocation cert:\CurrentUser\My -Subject "CN=Kyxgo Technology" -Type CodeSigningCert -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

      # Sign Main EXE File
      - name: Sign Main EXE
        shell: powershell
        run: |
          $cert = Get-ChildItem cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath "dist\KyxgoPartnerApp.exe" -Certificate $cert

      # Build Ultra-Fast & Silent Inno Setup Installer
      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          choco install innosetup -y
          
          $issContent = @"
          #define MyAppName "Kyxgo Partner App"
          #define MyAppVersion "1.0.${{ github.run_number }}"
          #define MyAppPublisher "Kyxgo Technology"
          #define MyAppURL "https://adityarai0133-rajput.github.io/kyxgo-partner-/"
          #define MyAppExeName "KyxgoPartnerApp.exe"

          [Setup]
          AppId={{8F4C82A2-4D93-4E82-9B7C-12A5C9B38012}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={userpf}\{#MyAppName}
          DisableProgramGroupPage=yes
          DefaultGroupName={#MyAppPublisher}
          OutputDir=output
          OutputBaseFilename=KyxgoPartnerApp-Setup
          SetupIconFile=logo.ico
          Compression=lzma/fast
          SolidCompression=no
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\{#MyAppExeName}

          ; Direct install configuration (Hides setup wizard UI)
          DisableWelcomePage=yes
          DisableReadyPage=yes
          DisableFinishedPage=yes
          DisableDirPage=yes
          AlwaysShowComponentsList=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "dist\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content -Path "setup.iss" -Value $issContent
          ISCC.exe setup.iss

      # Sign Installer EXE File
      - name: Sign Final Installer EXE
        shell: powershell
        run: |
          $cert = Get-ChildItem cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath "output\KyxgoPartnerApp-Setup.exe" -Certificate $cert

      # Upload Artifacts / Release
      - name: Create Release & Upload Executables
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kyxgo Partner App v1.0.${{ github.run_number }}
          files: |
            dist/KyxgoPartnerApp.exe
            output/KyxgoPartnerApp-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
