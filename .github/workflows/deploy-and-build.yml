name: Deploy Pages & Build Signed Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-sign:
    needs: deploy-pages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web Desktop App
        run: |
          npx --yes nativefier --name "Kyxgo Technology" "https://sites.google.com/view/kyxgo/technology" --single-instance --conceal app-build/

      - name: Cleanup Unnecessary Electron Files
        shell: powershell
        run: |
          if (Test-Path "app-build") {
              Get-ChildItem -Path "app-build" -Recurse -Filter "locales" | ForEach-Object {
                  Get-ChildItem -Path $_.FullName -Exclude "en-US.pak" | Remove-Item -Force
              }
              Get-ChildItem -Path "app-build" -Recurse -Include "*.pak.info", "LICENSES.chromium.html" | Remove-Item -Force
          }

      - name: Generate Code Signing Certificate & Sign Binary Files
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation cert:\CurrentUser\My -Subject "CN=Kyxgo Technology" -Type CodeSigningCert -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          
          if (Test-Path "app-build") {
              $files = Get-ChildItem -Path "app-build" -Recurse -Include *.exe, *.dll
              foreach ($file in $files) {
                  Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert
              }
          } else {
              Write-Error "app-build directory was not created!"
              exit 1
          }

      - name: Install Inno Setup & Build Fast Installer
        shell: powershell
        run: |
          choco install innosetup -y
          
          $issContent = @"
          [Setup]
          AppName=Kyxgo Technology
          AppVersion=1.0.${{ github.run_number }}
          DefaultDirName={userpf}\Kyxgo Technology
          DefaultGroupName=Kyxgo Technology
          OutputDir=output
          OutputBaseFilename=KyxgoTechnology-Setup
          Compression=lzma/fast
          SolidCompression=no
          PrivilegesRequired=lowest
          DisableWelcomePage=yes
          DisableReadyPage=yes
          DisableFinishedPage=yes
          DisableProgramGroupPage=yes
          DisableDirPage=yes
          
          [Files]
          Source: "app-build\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Kyxgo Technology"; Filename: "{app}\Kyxgo Technology.exe"
          Name: "{autodesktop}\Kyxgo Technology"; Filename: "{app}\Kyxgo Technology.exe"

          [Run]
          Filename: "{app}\Kyxgo Technology.exe"; Description: "Launch App"; Flags: postinstall nowait
          "@
          
          Set-Content -Path "setup.iss" -Value $issContent
          ISCC.exe setup.iss

      - name: Sign Final Installer EXE
        shell: powershell
        run: |
          $cert = Get-ChildItem cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath "output\KyxgoTechnology-Setup.exe" -Certificate $cert

      - name: Upload Fast Signed Installer
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kyxgo Fast Release v1.0.${{ github.run_number }}
          files: output/KyxgoTechnology-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
