name: Deploy Pages & Build Signed Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-sign:
    needs: deploy-pages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Web App Build With Custom Icon (.ico)
      - name: Build Web Desktop App
        run: |
          npx --yes nativefier --name "Kyxgo Technology" "https://sites.google.com/view/kyxgo/technology" --icon icon.ico --single-instance --conceal app-build/

      # Size Reduction Step: Unused Language Files & Extras Delete Karna
      - name: Optimize App Size (Cleanup Extra Locales)
        shell: powershell
        run: |
          Get-ChildItem -Path "app-build" -Recurse -Filter "locales" | ForEach-Object {
              Get-ChildItem -Path $_.FullName -Exclude "en-US.pak", "en-GB.pak" | Remove-Item -Force
          }

      # Code Signing Certificate Generate & Apply
      - name: Generate Code Signing Certificate & Sign Binary Files
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation cert:\CurrentUser\My -Subject "CN=Kyxgo Technology" -Type CodeSigningCert -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          
          $files = Get-ChildItem -Path "app-build" -Recurse -Include *.exe, *.dll
          foreach ($file in $files) {
              Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert
          }

      # Fast Silent Inno Setup With Custom App Logo
      - name: Install Inno Setup & Build Fast Installer
        shell: powershell
        run: |
          choco install innosetup -y
          
          $issContent = @"
          [Setup]
          AppName=Kyxgo Technology
          AppVersion=1.0.${{ github.run_number }}
          DefaultDirName={userpf}\Kyxgo Technology
          DefaultGroupName=Kyxgo Technology
          OutputDir=output
          OutputBaseFilename=KyxgoTechnology-Setup
          SetupIconFile=icon.ico
          Compression=lzma2/max
          SolidCompression=yes
          PrivilegesRequired=lowest
          DisableWelcomePage=yes
          DisableReadyPage=yes
          DisableFinishedPage=yes
          DisableProgramGroupPage=yes
          DisableDirPage=yes
          
          [Files]
          Source: "app-build\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Kyxgo Technology"; Filename: "{app}\Kyxgo Technology.exe"; IconFilename: "{app}\icon.ico"
          Name: "{autodesktop}\Kyxgo Technology"; Filename: "{app}\Kyxgo Technology.exe"; IconFilename: "{app}\icon.ico"

          [Run]
          Filename: "{app}\Kyxgo Technology.exe"; Description: "Launch App"; Flags: postinstall nowait
          "@
          
          Set-Content -Path "setup.iss" -Value $issContent
          ISCC.exe setup.iss

      # Final Installer EXE Sign Karna
      - name: Sign Final Installer EXE
        shell: powershell
        run: |
          $cert = Get-ChildItem cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath "output\KyxgoTechnology-Setup.exe" -Certificate $cert

      # Upload Signed Installer to Release
      - name: Upload Signed Files to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kyxgo Release v1.0.${{ github.run_number }}
          files: output/KyxgoTechnology-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
